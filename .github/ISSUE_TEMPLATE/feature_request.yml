name: ✨ Feature / experiment idea
description: Propose something new for the experience
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Ideas are welcome — especially shader experiments, motion refinements and accessibility wins.
        Please read `CONTRIBUTING.md` for the design principles this project protects.
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What should exist, and what should it feel like?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why does it belong here?
      description: How does it serve typography + motion + spatial composition + interaction + 3D + negative space?
  - type: textarea
    id: refs
    attributes:
      label: References
      description: Sketches, links, or prior art (original references only — no copied work).
  - type: dropdown
    id: contribution
    attributes:
      label: Would you like to build it?
      options:
        - "Yes — assign me"
        - "Maybe, with guidance"
        - "No — just the idea"
