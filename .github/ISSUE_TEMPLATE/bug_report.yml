name: 🐛 Bug report
description: Something is broken, janky or wrong in the experience
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. The more visual detail, the faster it gets fixed.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Clear, concise description of the issue.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: 1. Go to '…' 2. Scroll to '…' 3. See error
      placeholder: |
        1. Open the site on a phone
        2. Scroll to the Work section
        3. The panels don't stack vertically
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, browser + version, viewport size.
      placeholder: "macOS 15, Chrome 130, 1440×900"
    validations:
      required: true
  - type: dropdown
    id: reduced-motion
    attributes:
      label: Reduced motion enabled?
      options:
        - "No"
        - "Yes"
        - "Not sure"
  - type: textarea
    id: media
    attributes:
      label: Screenshots / clip
      description: Drag-and-drop images or a short recording — extremely helpful.
